<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="top-bar">
  <h1>Liberty Trust Capital Admin Dashboard</h1>
</header>

<section id="statsSection" class="stats-section">
  <h2>Dashboard Stats</h2>
  <div id="stats">
    <p>Total Users: <span id="totalUsers">0</span></p>
    <p>VIP Users: <span id="vipUsers">0</span></p>
    <p>Regular Users: <span id="regularUsers">0</span></p>
    <p>Blocked Users: <span id="blockedUsers">0</span></p>
  </div>
</section>

<section id="createUserSection" class="create-user-section">
  <h2>Create User Account</h2>
  <form id="createUserForm" enctype="multipart/form-data" autocomplete="off">
    <input type="text" name="name" id="name" placeholder="Full Name" required>
    <input type="email" name="email" id="email" placeholder="Email Address" required>
    <input type="text" name="country" id="country" placeholder="Country" required>
    <input type="text" name="state" id="state" placeholder="State" required>
    <input type="text" name="city" id="city" placeholder="City" required>
    <input type="text" name="zipcode" id="zipcode" placeholder="Zipcode / Postal Code" required>
    <input type="date" name="dob" id="dob" required>
    <input type="text" name="employment" id="employment" placeholder="Employment Type" required>

    <select name="accountType" id="accountType" required>
      <option value="">Select Account Type</option>
      <option value="vip">VIP</option>
      <option value="regular">Regular</option>
    </select>

    <label>Selfie Upload:</label>
    <input type="file" name="selfie" id="selfie" accept="image/*" required>

    <button type="submit">Create Account</button>
  </form>
</section>

<section id="usersListSection" class="users-list-section">
  <h2>All Users</h2>
  <input type="text" id="searchUser" placeholder="Search by name or email">
  <div id="usersList">
    <!-- Users will be dynamically added via JS -->
    <!-- Example:
    <div class="user-entry" data-userid="12345">
      <p>Name: John Doe</p>
      <p>Email: john@example.com</p>
      <p>Status: active</p>
      <button class="blockUserBtn">Block</button>
      <button class="unblockUserBtn">Unblock</button>
      <button class="freezeUserBtn">Freeze</button>
      <button class="unfreezeUserBtn">Unfreeze</button>
    </div>
    -->
  </div>
</section>

<!-- ================= FULL-SCREEN WHATSAPP-STYLE CHAT ================= -->
<section id="chatSection" class="chat-section" style="display:none;">
  <div class="chat-header">
    <button id="closeChat">&larr;</button>
    <span id="chatUserName">Chat with User</span>
  </div>

  <!-- User selection for chat -->
  <div class="chat-select-user">
    <label for="chatUserSelect">Select User:</label>
    <select id="chatUserSelect">
      <option value="">-- Select a User --</option>
      <!-- Options dynamically filled from backend -->
    </select>
  </div>

  <div id="chatBox"></div>

  <div class="chat-input">
    <input type="text" id="chatMessage" placeholder="Type a message...">
    <button id="sendMessage">Send</button>
  </div>
</section>

<!-- ONLY FRONTEND JS -->
<script src="frontend.js"></script>

</body>
</html>
