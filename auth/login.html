<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Liberty Trust Capital - User Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f8;
      color: #001f4d;
      padding: 10px;
    }

    .auth-container {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px; /* responsive max-width */
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #001f4d;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 30px;
      color: #001f4d;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #001f4d;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #001f4d;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #003366;
    }

    .msg {
      margin-top: 15px;
      font-size: 14px;
      color: red;
      min-height: 20px;
      text-align: center;
      word-wrap: break-word;
    }

    /* ================= MEDIA QUERIES ================= */
    @media (max-width: 768px) {
      .auth-container {
        padding: 30px 20px;
      }
      h1 { font-size: 26px; }
      h2 { font-size: 18px; }
      input { padding: 9px; font-size: 15px; }
      .btn { padding: 10px; font-size: 15px; }
    }

    @media (max-width: 480px) {
      .auth-container {
        padding: 25px 15px;
      }
      h1 { font-size: 22px; }
      h2 { font-size: 16px; }
      input { padding: 8px; font-size: 14px; }
      .btn { padding: 8px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h1>Liberty Trust Capital</h1>
    <h2>Login</h2>

    <form id="userLoginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="userEmail" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="userPassword" required />
      </div>

      <button type="submit" class="btn">Login</button>
      <p id="userLoginMsg" class="msg"></p>
    </form>
  </div>

  <script>
    const backendUrl = "http://localhost:5000";

    document.getElementById("userLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("userEmail").value;
      const password = document.getElementById("userPassword").value;
      const msg = document.getElementById("userLoginMsg");

      msg.textContent = "Logging in...";

      try {
        const res = await fetch(backendUrl + "/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (data.success) {
          localStorage.setItem("liberty_user_token", data.token);
          localStorage.setItem("liberty_user_info", JSON.stringify(data.user));
          msg.style.color = "green";
          msg.textContent = "Login successful!";
          window.location.href = "../user/user.html";
        } else {
          msg.style.color = "red";
          msg.textContent = data.message || "Login failed";
        }
      } catch (err) {
        msg.style.color = "red";
        msg.textContent = "Error connecting to server";
      }
    });
  </script>
</body>
</html>
