<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Password & PIN - Liberty Trust Capital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin:0; padding:0; font-family: Arial,sans-serif; }
    body { background:#f4f6f8; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:10px; }
    .card { background:#fff; padding:25px; width:100%; max-width:420px; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
    h2 { text-align:center; margin-bottom:20px; color:#001f4d; font-size:22px; }
    .form-group { margin-bottom:15px; }
    label { display:block; font-size:14px; margin-bottom:5px; }
    input { width:100%; padding:10px; font-size:14px; border:1px solid #ccc; border-radius:6px; }
    button { width:100%; padding:12px; background:#001f4d; color:white; border:none; cursor:pointer; font-size:15px; border-radius:6px; margin-top:10px; transition:0.3s; }
    button:hover { background:#003366; }
    .msg { margin-top:10px; font-size:14px; color:red; text-align:center; word-wrap:break-word; }
    .hidden { display:none; }
    @media (max-width:768px){ .card{padding:20px;} h2{font-size:20px;} input{padding:9px; font-size:13px;} button{padding:10px; font-size:14px;} }
    @media (max-width:480px){ .card{padding:15px;} h2{font-size:18px;} input{padding:8px;font-size:12px;} button{padding:8px;font-size:13px;} }
  </style>
</head>
<body>

<div class="card">

  <!-- STEP 1: PASSWORD -->
  <form id="passwordForm">
    <h2>Create Password</h2>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required />
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" required />
    </div>
    <button type="submit">Continue</button>
    <p id="passMsg" class="msg"></p>
  </form>

  <!-- STEP 2: PIN -->
  <form id="pinForm" class="hidden">
    <h2>Create Transaction PIN</h2>
    <div class="form-group">
      <label>4-Digit PIN</label>
      <input type="password" id="pin" maxlength="4" required />
    </div>
    <div class="form-group">
      <label>Confirm PIN</label>
      <input type="password" id="confirmPin" maxlength="4" required />
    </div>
    <button type="submit">Finish Setup</button>
    <p id="pinMsg" class="msg"></p>
  </form>

</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const userIdFromQuery = urlParams.get("user"); // get user ID from email link

  const passwordForm = document.getElementById("passwordForm");
  const pinForm = document.getElementById("pinForm");

  let passwordValue = "";

  // PASSWORD STEP
  passwordForm.addEventListener("submit", async function(e) {
    e.preventDefault();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirmPassword").value;
    const msg = document.getElementById("passMsg");

    if (password.length < 6) { msg.textContent = "Password must be at least 6 characters"; return; }
    if (password !== confirm) { msg.textContent = "Passwords do not match"; return; }

    passwordValue = password;

    passwordForm.classList.add("hidden");
    pinForm.classList.remove("hidden");
  });

  // PIN STEP
  pinForm.addEventListener("submit", async function(e) {
    e.preventDefault();
    const pin = document.getElementById("pin").value;
    const confirm = document.getElementById("confirmPin").value;
    const msg = document.getElementById("pinMsg");

    if (!/^\d{4}$/.test(pin)) { msg.textContent = "PIN must be exactly 4 digits"; return; }
    if (pin !== confirm) { msg.textContent = "PINs do not match"; return; }

    try {
      const res = await fetch("/api/user/set-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: userIdFromQuery, password: passwordValue, pin })
      });
      const data = await res.json();

      if (data.success) {
        msg.style.color = "green";
        msg.textContent = "Setup complete. Redirecting...";
        setTimeout(() => { window.location.href = "user-dashboard.html"; }, 1200);
      } else {
        msg.textContent = data.message || "Error setting password/PIN";
      }
    } catch (err) {
      msg.textContent = "Server error. Try again.";
    }
  });
</script>

</body>
</html>
