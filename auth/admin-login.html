<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Liberty Trust Capital - Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f8;
      color: #001f4d;
      padding: 10px; /* small padding for mobile */
    }

    .auth-container {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px; /* makes it responsive */
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .auth-container h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #001f4d;
    }

    .auth-container h2 {
      font-size: 20px;
      margin-bottom: 30px;
      color: #001f4d;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #001f4d;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #001f4d;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #003366;
    }

    .msg {
      margin-top: 15px;
      font-size: 14px;
      color: red;
      min-height: 20px;
      text-align: center;
      word-wrap: break-word;
    }

    /* ================= MEDIA QUERIES ================= */
    /* Tablets */
    @media (max-width: 1024px) {
      .auth-container h1 {
        font-size: 26px;
      }
      .auth-container h2 {
        font-size: 18px;
      }
    }

    /* Mobile Phones */
    @media (max-width: 768px) {
      .auth-container {
        padding: 30px 20px;
      }
      .auth-container h1 {
        font-size: 24px;
      }
      .auth-container h2 {
        font-size: 16px;
      }
      .form-group input {
        padding: 10px 12px;
        font-size: 15px;
      }
      .btn {
        padding: 10px;
        font-size: 15px;
      }
    }

    /* Extra Small Devices */
    @media (max-width: 480px) {
      .auth-container {
        padding: 25px 15px;
      }
      .auth-container h1 {
        font-size: 22px;
      }
      .auth-container h2 {
        font-size: 15px;
      }
      .form-group input {
        padding: 8px 10px;
        font-size: 14px;
      }
      .btn {
        padding: 8px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
 <div class="auth-container">
  <h1>Liberty Trust Capital</h1>
  <h2>Admin Login</h2>

  <form id="adminLoginForm">
    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        id="adminEmail"
        placeholder="admin@libertytrustcapital.com"
        required
      />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        id="adminPassword"
        placeholder="Enter admin password"
        required
      />
    </div>

    <button type="submit" class="btn">Login</button>
    <p id="adminLoginMsg" class="msg"></p>
  </form>
</div>

<script>
const backendUrl = "http://localhost:5000";

// Elements
const adminForm = document.getElementById("adminLoginForm");
const emailInput = document.getElementById("adminEmail");
const passwordInput = document.getElementById("adminPassword");
const msg = document.getElementById("adminLoginMsg");

adminForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  if (!email || !password) {
    msg.textContent = "Please enter email and password.";
    return;
  }

  msg.textContent = "Logging in...";

  try {
    const res = await fetch(`${backendUrl}/api/admin/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.success && data.token) {
      localStorage.setItem("liberty_admin_token", data.token);
      msg.style.color = "green";
      msg.textContent = "Login successful";

      setTimeout(() => {
        window.location.href = "../dashboard/admin.html";
      }, 500);
    } else {
      msg.style.color = "red";
      msg.textContent = data.message || "Invalid admin credentials";
    }
  } catch (err) {
    console.error(err);
    msg.style.color = "red";
    msg.textContent = "Server error. Try again.";
  }
});
</script>
</body>
</html>
