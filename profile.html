<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Liberty Trust Capital</title>
  <link rel="stylesheet" href="profile.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">LTC</div>

    <!-- Hamburger -->
    <button class="hamburger" id="hamburger" aria-label="Toggle Menu">&#9776;</button>

    <ul class="menu" id="menu">
      <li><a href="user-dashboard.html">Dashboard</a></li>
      <li><a href="send-money.html">Send Money</a></li>
      <li><a href="transactions.html">Transactions</a></li>
      <li><a href="profile.html" class="active">Profile</a></li>
    </ul>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="main">
    <h1>Your Profile</h1>

    <!-- Personal Info -->
    <section class="form-card">
      <h2>Personal Info</h2>
      <form id="personalForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" />
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" readonly />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="phone" />
        </div>
        <div class="form-group">
          <label>Residential Address</label>
          <input type="text" id="address" />
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="dob" readonly />
        </div>
        <button type="submit" class="btn">Save Personal Info</button>
        <p id="personalMsg" class="msg"></p>
      </form>
    </section>

    <!-- Account Details -->
    <section class="form-card">
      <h2>Account Details</h2>
      <form>
        <div class="form-group">
          <label>Customer ID</label>
          <input type="text" id="customerId" readonly />
        </div>
        <div class="form-group">
          <label>Account Number</label>
          <input type="text" id="accountNumber" readonly />
        </div>
        <div class="form-group">
          <label>Account Type</label>
          <input type="text" id="accountType" readonly />
        </div>
        <div class="form-group">
          <label>Status</label>
          <input type="text" value="Active" readonly />
        </div>
        <div class="form-group">
          <label>Currency</label>
          <input type="text" value="USD" readonly />
        </div>
      </form>
    </section>

    <!-- Security -->
    <section class="form-card">
      <h2>Security Settings</h2>
      <form id="securityForm">
        <div class="form-group">
          <label>Change Password</label>
          <input type="password" id="password" />
        </div>
        <div class="form-group">
          <label>Change PIN</label>
          <input type="password" id="pin" maxlength="4" />
        </div>
        <div class="form-group">
          <label>Two-Factor Authentication</label>
          <select id="twoFactor">
            <option value="enabled">Enabled</option>
            <option value="disabled">Disabled</option>
          </select>
        </div>
        <button type="submit" class="btn">Save Security Settings</button>
        <p id="securityMsg" class="msg"></p>
      </form>
    </section>
  </div>

  <script src="auth-guard.js"></script>
  <script src="profile.js"></script>

  <script>
    const hamburger = document.getElementById('hamburger');
    const menu = document.getElementById('menu');

    hamburger.addEventListener('click', () => {
      menu.classList.toggle('show');
    });

    // Close menu when a link is clicked (mobile)
    menu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => menu.classList.remove('show'));
    });
  </script>
</body>
</html>
