<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions - LTC</title>
  <link rel="stylesheet" href="transactions.css" />
</head>
<body>

  <!-- ================= NAVBAR ================= -->
  <header>
    <div class="navbar">
      <div class="logo">LTC</div>

      <!-- Hamburger -->
      <button class="hamburger" id="hamburger" aria-label="Toggle Menu">&#9776;</button>

      <nav class="menu" id="menu">
        <ul>
          <li><a href="user-dashboard.html">Dashboard</a></li>
          <li><a href="send-money.html">Send Money</a></li>
          <li><a href="transactions.html" class="active">Transactions</a></li>
          <li><a href="profile.html">Profile</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="main">
    <h1>Transaction History</h1>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>To</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="txBody">
          <!-- Filled dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- ================= SCRIPTS ================= -->
  <script src="auth-guard.js"></script>
  <script src="transactions.js"></script>

  <script>
    // Hamburger toggle
    const hamburger = document.getElementById('hamburger');
    const menu = document.getElementById('menu');

    hamburger.addEventListener('click', () => {
      menu.classList.toggle('show');
    });

    // Close menu when a link is clicked (mobile)
    menu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => menu.classList.remove('show'));
    });
  </script>
</body>
</html>
